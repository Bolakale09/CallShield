name: Build APK

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: CallShield

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run spam-detector tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testFullDebugUnitTest

      - name: Prepare your signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/callshield.jks"
            echo "CALLSHIELD_KEYSTORE_FILE=$RUNNER_TEMP/callshield.jks" >> "$GITHUB_ENV"
            echo "Signing with your own key"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - using the shared debug key"
          fi

      - name: Build APKs (full + lite)
        env:
          CALLSHIELD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the APKs have no internet permission
        run: |
          AAPT2=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          for APK in app/build/outputs/apk/*/release/*.apk; do
            echo "== $APK"
            "$AAPT2" dump permissions "$APK" | tee perms.txt
            if grep -qE "INTERNET|NETWORK_STATE|WIFI_STATE" perms.txt; then
              echo "ERROR: $APK requests network access but must be offline-only"; exit 1
            fi
          done
          echo "OK: offline-only APKs"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CallShield-apk
          path: CallShield/app/build/outputs/apk/*/release/*.apk
